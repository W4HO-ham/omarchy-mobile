# Omarchy Mobile (Pixel 7 Pro): at a critical battery, power off cleanly.
# upower's default action is a suspend, and suspended at 2 % the phone runs
# flat asleep (about 20 minutes at 312 mA): a brown-out with the root file
# system mounted. Power off works on kernels with linux-omarchy-mobile#233
# (kernel-2026.11.13 on), and an off phone on a charger starts the dark
# charging boot (omamobile-charger.target) instead of the whole phone.
# device/cheetah/SUSPEND-PLAN.md 6.6, P7.
[UPower]
PercentageAction=3
CriticalPowerAction=PowerOff
