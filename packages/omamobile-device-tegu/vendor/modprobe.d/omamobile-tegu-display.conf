# The panel's brightness, sleep and refresh rate go over DSI commands.
options gs_dsim_cmd allow_tx=1
# 120 Hz (kernel #88) and the panel really off on DPMS, as the owner's phone
# runs it. omamobile-tegu-graphics-start adds stage=2 (the full driver) and
# fbdev=0 on its modprobe line.
options gs_decon max_refresh=120 screen_off=2
